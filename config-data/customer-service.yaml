server:
  port: 0

spring:
  application:
    name: customer-service

  # TODO ESTO DEBE IR DENTRO DE "spring" (2 espacios a la derecha)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/customerms
    username: postgres
    password: "ambar2004"
    driver-class-name: org.postgresql.Driver  # Es bueno explicitarlo, aunque opcional

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER:http://localhost:9090/realms/sisgr-realm}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}