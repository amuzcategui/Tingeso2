server:
  port: 8070

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Configuración de descubrimiento automático (opcional, pero útil)
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Filtros por defecto para TODAS las rutas
      default-filters:
        # DedupeResponseHeader: Si el microservicio envía CORS y el Gateway
        # intenta añadir algo (o hay un proxy intermedio), esto asegura que
        # solo llegue UN header al navegador. RETAIN_UNIQUE se queda con el primero.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      # Definición de Rutas
      routes:
        # --- USER SERVICE ---
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/users/**
          # Nota: No necesitamos RewritePath si el controller escucha en /users

        # --- CUSTOMER SERVICE ---
        - id: customer
          uri: lb://customer-service
          predicates:
            - Path=/customer/**

        # --- INVENTORY SERVICE ---
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/tools/**

        # --- LOAN SERVICE ---
        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/loan/**

        # --- KARDEX SERVICE ---
        - id: kardex
          uri: lb://kardex-service
          predicates:
            - Path=/kardex/**

        # --- PRICING SERVICE ---
        - id: pricing
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**

        # --- REPORTING SERVICE ---
        - id: reporting
          uri: lb://reporting-service
          predicates:
            - Path=/reporting/**

# Configuración de Eureka
eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/