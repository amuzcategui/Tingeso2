server:
  port: 8070

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/sisgr-realm

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:8070"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: customer
          uri: lb://customer-service
          predicates:
            - Path=/customer/**
          filters:
            - RewritePath=/customer/(?<segment>.*), /api/v1/customer/$\{segment}

        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/tools/**
          filters:
            - RewritePath=/tools/(?<segment>.*), /api/v1/tools/$\{segment}

        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/loan/**
          filters:
            - RewritePath=/loan/(?<segment>.*), /api/v1/loan/$\{segment}

        - id: kardex
          uri: lb://kardex-service
          predicates:
            - Path=/kardex/**
          filters:
            - RewritePath=/kardex/(?<segment>.*), /api/v1/kardex/$\{segment}

        - id: pricing
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**
          filters:
            - RewritePath=/pricing/(?<segment>.*), /api/v1/pricing/$\{segment}

        - id: reporting
          uri: lb://reporting-service
          predicates:
            - Path=/reporting/**
          filters:
            - RewritePath=/reporting/(?<segment>.*), /api/v1/reporting/$\{segment}

        - id: user
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - RewritePath=/users/(?<segment>.*), /api/v1/users/${segment}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
