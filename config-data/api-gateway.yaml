server:
  port: 8070

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/sisgr-realm

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: false

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      routes:
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: customer
          uri: lb://customer-service
          predicates:
            - Path=/customer/**
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/tools/**
        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/loan/**
        - id: kardex
          uri: lb://kardex-service
          predicates:
            - Path=/kardex/**
        - id: pricing
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**
        - id: reporting
          uri: lb://reporting-service
          predicates:
            - Path=/reporting/**

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
