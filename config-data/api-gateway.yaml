server:
  port: 8070

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/sisgr-realm

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
            default-filters:
              - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            globalcors:
              add-to-simple-url-handler-mapping: true
              corsConfigurations:
                "[/**]":
                  allowedOrigins:
                    - "http://localhost:5173"
                    - "http://localhost:8070"
                    - "http://localhost:8761"
                    - "http://localhost:8888"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                    - OPTIONS
                  allowedHeaders:
                    - Authorization
                    - Content-Type
                  exposedHeaders:
                      - Authorization
                  allowCredentials: true

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: customer
          uri: lb://customer-service
          predicates:
            - Path=/customer/**


        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/tools/**


        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/loan/**
          filters:
            - RewritePath=/loan/(?<segment>.*), /api/v1/loan/$\{segment}

        - id: kardex
          uri: lb://kardex-service
          predicates:
            - Path=/kardex/**
          filters:
            - RewritePath=/kardex/(?<segment>.*), /api/v1/kardex/$\{segment}

        - id: pricing
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**
          filters:
            - RewritePath=/pricing/(?<segment>.*), /api/v1/pricing/$\{segment}

        - id: reporting
          uri: lb://reporting-service
          predicates:
            - Path=/reporting/**
          filters:
            - RewritePath=/reporting/(?<segment>.*), /api/v1/reporting/$\{segment}

        - id: user
          uri: lb://user-service
          predicates:
            - Path=/users/**


