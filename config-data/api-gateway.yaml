server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway-server

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/sisgr-realm

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                exposedHeaders:
                  - Authorization
      routes:
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: customer
          uri: lb://customer-service
          predicates:
            - Path=/customer/**
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/tools/**
        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/loan/**
        - id: kardex
          uri: lb://kardex-service
          predicates:
            - Path=/kardex/**
        - id: pricing
          uri: lb://pricing-service
          predicates:
            - Path=/pricing/**
        - id: reporting
          uri: lb://reporting-service
          predicates:
            - Path=/reporting/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted

