server:
  port: 0  # puerto aleatorio (cumple con "no asignación de puertos")

spring:
  application:
    name: reporting-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_ISSUER:http://localhost:9090/realms/sisgr-realm}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/reportingms
    username: postgres
    password: "ambar2004"

  jpa:
    hibernate:
      ddl-auto: update   # crea/actualiza tablas automáticamente
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka-server-service:8761/eureka/

  services:
    loan:
      base-url: ${LOAN_URL:http://loan-service}
    kardex:
      base-url: ${KARDEX_URL:http://kardex-service}
    customer:
      base-url: ${CUSTOMER_URL:http://customer-service}